name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_BACKEND: developer
      GEMINI_API_KEY: test-key
      OCR_BACKEND: tesseract
      RAG_RATE_LIMIT_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Test backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -q
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test frontend and audit production dependencies
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: asia-south1
      REPOSITORY: gyaan-sarthi
      VM_NAME: gyaan-sarthi
      VM_ZONE: asia-south1-a
    steps:
      - uses: actions/checkout@v7
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Validate deployment variables
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          test -n "$APP_DOMAIN"
          test -n "$API_DOMAIN"
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_APP_ID"
      - name: Build and publish immutable images
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: |
          registry="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY"
          backend_image="$registry/backend:${GITHUB_SHA}"
          frontend_image="$registry/frontend:${GITHUB_SHA}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --tag "$backend_image" .
          docker build \
            --build-arg NEXT_PUBLIC_RAG_API_URL="https://$API_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$FIREBASE_API_KEY" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$FIREBASE_AUTH_DOMAIN" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$FIREBASE_APP_ID" \
            --tag "$frontend_image" frontend
          docker push "$backend_image"
          docker push "$frontend_image"
          echo "BACKEND_IMAGE=$backend_image" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$frontend_image" >> "$GITHUB_ENV"
      - name: Install current release script on VM
        run: |
          gcloud compute scp deploy/release.sh "$VM_NAME:/tmp/gyaan-sarthi-release.sh" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --zone "$VM_ZONE" \
            --tunnel-through-iap \
            --quiet
          gcloud compute ssh "$VM_NAME" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --zone "$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo install -m 0755 /tmp/gyaan-sarthi-release.sh /opt/gyaan-sarthi/deploy/release.sh"
      - name: Deploy through IAP and verify rollback protection
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --zone "$VM_ZONE" \
            --tunnel-through-iap \
            --quiet \
            --command "sudo /opt/gyaan-sarthi/deploy/release.sh '$BACKEND_IMAGE' '$FRONTEND_IMAGE' '${GITHUB_SHA}'"
